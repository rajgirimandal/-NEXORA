<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora Luxe — Premium Fashion, Quietly Made</title>
<meta name="description" content="Nexora Luxe is a premium fashion house for men and women — tailored outerwear, elevated essentials, and considered accessories.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
/* ==========================================================================
   NEXORA LUXE — Design System
   Quiet luxury: near-black surfaces, gold used sparingly, hairline structure,
   editorial Didone display type paired with a clean geometric sans.
   ========================================================================== */

:root {
  /* Color */
  --bg:            #0a0a09;
  --surface:       #141310;
  --surface-alt:   #1c1a15;
  --border:        #34302a;
  --border-soft:   #242019;
  --gold:          #c6a24d;
  --gold-light:    #e6cd8c;
  --gold-dim:      #8a6f34;
  --ivory:         #f3ede0;
  --ivory-dim:     #cdc6b6;
  --muted:         #8a8377;
  --danger:        #b0483f;
  --overlay:       rgba(10, 10, 9, 0.86);

  /* Type */
  --font-display: "Playfair Display", "Times New Roman", serif;
  --font-body: "Jost", "Helvetica Neue", Arial, sans-serif;

  /* Scale (Elements of Typographic Style-ish, 1.25 ratio) */
  --step--1: 0.8rem;
  --step-0:  1rem;
  --step-1:  1.25rem;
  --step-2:  1.563rem;
  --step-3:  1.953rem;
  --step-4:  2.441rem;
  --step-5:  3.052rem;
  --step-6:  3.815rem;

  --content-max: 78rem;
  --measure: 62ch;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

/* ---- Reset ---- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ivory);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
ul { list-style: none; margin: 0; padding: 0; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 500; margin: 0; line-height: 1.15; }
p { margin: 0; }
input, select, textarea { font-family: inherit; font-size: inherit; }

:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---- Layout helpers ---- */
.wrap {
  max-width: var(--content-max);
  margin-inline: auto;
  padding-inline: clamp(1.25rem, 4vw, 3rem);
}
.section { padding-block: clamp(3.5rem, 8vw, 6.5rem); }
.hairline { border-top: 1px solid var(--border); }
.eyebrow {
  font-family: var(--font-body);
  font-size: var(--step--1);
  letter-spacing: 0.22em;
  color: var(--gold);
  text-transform: uppercase;
}
.measure { max-width: var(--measure); }

/* ---- Buttons ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.6em;
  padding: 0.9em 1.9em;
  font-size: var(--step--1);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border: 1px solid var(--gold-dim);
  background: transparent;
  color: var(--ivory);
  transition: background 0.25s var(--ease), color 0.25s var(--ease), border-color 0.25s var(--ease);
  white-space: nowrap;
}
.btn:hover { border-color: var(--gold); color: var(--gold-light); }
.btn-solid {
  background: var(--gold);
  border-color: var(--gold);
  color: #16140f;
}
.btn-solid:hover { background: var(--gold-light); border-color: var(--gold-light); color: #16140f; }
.btn-ghost { border-color: transparent; padding-inline: 0.2em; }
.btn-ghost:hover { border-color: transparent; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-block { width: 100%; }

/* ---- Header / Nav ---- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(10, 10, 9, 0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border-soft);
}
.site-header .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-block: 1.1rem;
}
.brand {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  font-family: var(--font-display);
  font-size: var(--step-2);
  letter-spacing: 0.06em;
}
.brand .ring {
  width: 2rem;
  height: 2rem;
  border-radius: 50%;
  border: 1px solid var(--gold);
  display: grid;
  place-items: center;
  font-size: 0.9rem;
  color: var(--gold);
}
.nav-links {
  display: flex;
  gap: clamp(1rem, 3vw, 2.2rem);
  font-size: var(--step--1);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.nav-links a { position: relative; padding-bottom: 0.2rem; color: var(--ivory-dim); transition: color 0.2s var(--ease); }
.nav-links a:hover, .nav-links a.active { color: var(--gold-light); }
.nav-links a.active::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -0.1rem;
  height: 1px;
  background: var(--gold);
}
.nav-actions { display: flex; align-items: center; gap: 1.2rem; }
.icon-btn {
  position: relative;
  background: none;
  border: none;
  color: var(--ivory);
  padding: 0.2rem;
  display: inline-flex;
}
.icon-btn:hover { color: var(--gold-light); }
.cart-count {
  position: absolute;
  top: -0.45rem;
  right: -0.6rem;
  background: var(--gold);
  color: #16140f;
  font-size: 0.65rem;
  font-family: var(--font-body);
  font-weight: 600;
  width: 1.15rem;
  height: 1.15rem;
  border-radius: 50%;
  display: grid;
  place-items: center;
}
.nav-toggle { display: none; background: none; border: none; color: var(--ivory); }

@media (max-width: 860px) {
  .nav-links { display: none; }
  .nav-toggle { display: inline-flex; }
  .nav-links.open {
    display: flex;
    position: absolute;
    top: 100%; left: 0; right: 0;
    flex-direction: column;
    background: var(--surface);
    padding: 1.5rem clamp(1.25rem, 4vw, 3rem);
    border-bottom: 1px solid var(--border);
    gap: 1.2rem;
  }
}

/* ---- Footer ---- */
.site-footer {
  border-top: 1px solid var(--border-soft);
  padding-block: 3.5rem 2rem;
  color: var(--ivory-dim);
}
.footer-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1.2fr;
  gap: 2.5rem;
}
.footer-grid h4 {
  font-family: var(--font-body);
  font-size: var(--step--1);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 1rem;
}
.footer-grid ul { display: grid; gap: 0.6rem; font-size: 0.92rem; }
.footer-grid ul a:hover { color: var(--gold-light); }
.footer-bottom {
  margin-top: 3rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border-soft);
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  color: var(--muted);
  flex-wrap: wrap;
  gap: 0.5rem;
}
@media (max-width: 720px) {
  .footer-grid { grid-template-columns: 1fr 1fr; }
}

/* ---- Hero (home) ---- */
.hero {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  min-height: 82vh;
  align-items: stretch;
}
.hero-copy {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1.6rem;
  padding: clamp(2rem, 5vw, 4rem);
}
.hero-copy h1 {
  font-size: clamp(2.6rem, 6vw, 4.6rem);
  letter-spacing: 0.005em;
}
.hero-copy .lede { color: var(--ivory-dim); max-width: 34ch; font-size: var(--step-1); }
.hero-media {
  position: relative;
  overflow: hidden;
  background: var(--surface);
}
.hero-media img {
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0;
  animation: reveal 1.1s var(--ease) forwards 0.15s;
}
.hero-copy > * {
  opacity: 0;
  transform: translateY(10px);
  animation: reveal-up 0.8s var(--ease) forwards;
}
.hero-copy > *:nth-child(1) { animation-delay: 0.05s; }
.hero-copy > *:nth-child(2) { animation-delay: 0.18s; }
.hero-copy > *:nth-child(3) { animation-delay: 0.32s; }
.hero-copy > *:nth-child(4) { animation-delay: 0.46s; }

@keyframes reveal { to { opacity: 1; } }
@keyframes reveal-up { to { opacity: 1; transform: translateY(0); } }

@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; min-height: auto; }
  .hero-media { height: 60vh; order: -1; }
}

/* ---- Section headings ---- */
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: clamp(1.8rem, 4vw, 3rem);
  flex-wrap: wrap;
}
.section-head h2 { font-size: clamp(1.8rem, 3.4vw, 2.6rem); }

/* ---- Category strip ---- */
.category-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--border);
}
.category-card {
  position: relative;
  background: var(--bg);
  aspect-ratio: 3/4;
  overflow: hidden;
}
.category-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s var(--ease); }
.category-card:hover img { transform: scale(1.04); }
.category-card .label {
  position: absolute; inset: auto 0 0 0;
  padding: 1.4rem;
  background: linear-gradient(to top, rgba(10,10,9,0.85), transparent);
  font-family: var(--font-display);
  font-size: var(--step-2);
}
@media (max-width: 720px) { .category-strip { grid-template-columns: 1fr; } }

/* ---- Product grid ---- */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: clamp(1.5rem, 3vw, 2.5rem);
}
.product-card { display: flex; flex-direction: column; gap: 0.8rem; }
.product-card .thumb {
  position: relative;
  overflow: hidden;
  background: var(--surface);
  aspect-ratio: 3/4;
}
.product-card .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s var(--ease), opacity 0.3s ease; }
.product-card:hover .thumb img { transform: scale(1.035); }
.product-card .tag {
  position: absolute; top: 0.8rem; left: 0.8rem;
  font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--gold-light);
  background: rgba(10,10,9,0.75);
  padding: 0.3em 0.7em;
  border: 1px solid var(--gold-dim);
}
.product-card .quick-add {
  position: absolute; left: 0.8rem; right: 0.8rem; bottom: 0.8rem;
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.25s var(--ease), transform 0.25s var(--ease);
}
.product-card:hover .quick-add { opacity: 1; transform: translateY(0); }
.product-card .name { font-size: 1rem; }
.product-card .meta { display: flex; justify-content: space-between; color: var(--ivory-dim); font-size: 0.88rem; }
.product-card .price { color: var(--gold-light); }
.product-card a.title-link:hover { color: var(--gold-light); }

/* ---- Filters bar ---- */
.filters-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin-bottom: 2.2rem;
}
.chip {
  border: 1px solid var(--border);
  padding: 0.5em 1.1em;
  font-size: 0.82rem;
  letter-spacing: 0.06em;
  color: var(--ivory-dim);
  background: transparent;
  transition: all 0.2s var(--ease);
}
.chip:hover { border-color: var(--gold-dim); color: var(--ivory); }
.chip.active { border-color: var(--gold); color: var(--gold-light); background: rgba(198,162,77,0.08); }

.toolbar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 1.2rem; flex-wrap: wrap; gap: 1rem;
  color: var(--ivory-dim); font-size: 0.85rem;
}
.select-minimal {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--ivory);
  padding: 0.5em 0.8em;
}

/* ---- Editorial / About blocks ---- */
.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: clamp(2rem, 5vw, 4.5rem);
  align-items: center;
}
.split img { width: 100%; aspect-ratio: 4/5; object-fit: cover; }
@media (max-width: 800px) { .split { grid-template-columns: 1fr; } }

.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; }
.stat-row .num { font-family: var(--font-display); font-size: clamp(2rem, 4vw, 2.8rem); color: var(--gold-light); }
.stat-row .label { color: var(--ivory-dim); font-size: 0.85rem; letter-spacing: 0.06em; }

/* ---- Product detail ---- */
.pdp {
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: clamp(2rem, 5vw, 4rem);
}
.pdp-gallery-main { aspect-ratio: 4/5; overflow: hidden; background: var(--surface); }
.pdp-gallery-main img { width: 100%; height: 100%; object-fit: cover; }
.pdp-thumbs { display: flex; gap: 0.7rem; margin-top: 0.7rem; }
.pdp-thumbs button {
  width: 4.2rem; aspect-ratio: 4/5;
  border: 1px solid var(--border);
  background: var(--surface);
  padding: 0; overflow: hidden;
}
.pdp-thumbs button.active { border-color: var(--gold); }
.pdp-thumbs img { width: 100%; height: 100%; object-fit: cover; }
.pdp-info h1 { font-size: clamp(1.9rem, 3.4vw, 2.6rem); }
.pdp-price { font-size: var(--step-2); color: var(--gold-light); margin-block: 0.6rem 1.4rem; }
.pdp-desc { color: var(--ivory-dim); margin-bottom: 1.6rem; }
.option-group { margin-bottom: 1.6rem; }
.option-label { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.6rem; color: var(--ivory-dim); }
.size-row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
.size-btn {
  min-width: 3rem; padding: 0.6em 0.4em;
  border: 1px solid var(--border);
  background: transparent; color: var(--ivory);
  font-size: 0.85rem;
  text-align: center;
}
.size-btn:hover { border-color: var(--gold-dim); }
.size-btn.active { border-color: var(--gold); color: var(--gold-light); background: rgba(198,162,77,0.08); }
.qty-row { display: flex; align-items: center; border: 1px solid var(--border); width: max-content; }
.qty-row button { background: none; border: none; color: var(--ivory); width: 2.4rem; height: 2.4rem; font-size: 1.1rem; }
.qty-row span { width: 2.4rem; text-align: center; font-size: 0.95rem; }
.pdp-actions { display: flex; gap: 0.9rem; margin-top: 1.8rem; flex-wrap: wrap; }
.accordion-item { border-top: 1px solid var(--border-soft); padding-block: 1.1rem; }
.accordion-item summary { cursor: pointer; display: flex; justify-content: space-between; font-size: 0.95rem; list-style: none; }
.accordion-item summary::-webkit-details-marker { display: none; }
.accordion-item p { margin-top: 0.9rem; color: var(--ivory-dim); font-size: 0.92rem; }

/* ---- Cart drawer ---- */
.cart-drawer-overlay {
  position: fixed; inset: 0;
  background: var(--overlay);
  z-index: 60;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s var(--ease);
}
.cart-drawer-overlay.open { opacity: 1; pointer-events: auto; }
.cart-drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(26rem, 100%);
  background: var(--surface);
  border-left: 1px solid var(--border);
  z-index: 61;
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.35s var(--ease);
}
.cart-drawer.open { transform: translateX(0); }
.cart-drawer-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 1.4rem 1.5rem;
  border-bottom: 1px solid var(--border-soft);
  font-family: var(--font-display); font-size: var(--step-2);
}
.cart-drawer-body { flex: 1; overflow-y: auto; padding: 1.2rem 1.5rem; }
.cart-line { display: flex; gap: 1rem; padding-block: 1rem; border-bottom: 1px solid var(--border-soft); }
.cart-line img { width: 4.6rem; aspect-ratio: 4/5; object-fit: cover; }
.cart-line-info { flex: 1; display: flex; flex-direction: column; gap: 0.35rem; }
.cart-line-top { display: flex; justify-content: space-between; gap: 0.5rem; }
.cart-line-meta { font-size: 0.8rem; color: var(--muted); }
.cart-line-controls { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
.cart-drawer-foot { padding: 1.3rem 1.5rem 1.6rem; border-top: 1px solid var(--border-soft); }
.subtotal-row { display: flex; justify-content: space-between; margin-bottom: 1rem; font-size: 1.05rem; }
.empty-state { text-align: center; padding-block: 3rem; color: var(--muted); }
.remove-link { font-size: 0.78rem; color: var(--muted); text-decoration: underline; }
.remove-link:hover { color: var(--danger); }

/* ---- Cart page table ---- */
.cart-table { width: 100%; border-collapse: collapse; }
.cart-table th { text-align: left; font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
.cart-table td { padding-block: 1.4rem; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
.cart-row-product { display: flex; gap: 1.2rem; }
.cart-row-product img { width: 5.5rem; aspect-ratio: 4/5; object-fit: cover; }
.cart-summary {
  border: 1px solid var(--border);
  padding: 1.6rem;
  height: max-content;
}
.cart-summary .row { display: flex; justify-content: space-between; margin-bottom: 0.9rem; font-size: 0.92rem; color: var(--ivory-dim); }
.cart-summary .row.total { color: var(--ivory); font-size: 1.15rem; border-top: 1px solid var(--border-soft); padding-top: 1rem; margin-top: 1rem; }
.cart-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 3rem; align-items: start; }
@media (max-width: 860px) { .cart-layout { grid-template-columns: 1fr; } }

/* ---- Forms (checkout / contact) ---- */
.field { margin-bottom: 1.2rem; }
.field label { display: block; font-size: 0.82rem; letter-spacing: 0.05em; color: var(--ivory-dim); margin-bottom: 0.5rem; }
.field input, .field select, .field textarea {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--ivory);
  padding: 0.85em 1em;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold-dim); outline: none; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media (max-width: 560px) { .field-row { grid-template-columns: 1fr; } }

.checkout-layout { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: clamp(2rem, 5vw, 4rem); align-items: start; }
@media (max-width: 900px) { .checkout-layout { grid-template-columns: 1fr; } }
.checkout-steps { display: flex; gap: 0.5rem; margin-bottom: 2rem; font-size: 0.8rem; color: var(--muted); align-items: center; letter-spacing: 0.04em; }
.checkout-steps .active { color: var(--gold-light); }
.order-summary { border: 1px solid var(--border); padding: 1.6rem; }
.order-line { display: flex; gap: 1rem; padding-block: 0.9rem; border-bottom: 1px solid var(--border-soft); font-size: 0.88rem; }
.order-line img { width: 3.4rem; aspect-ratio: 4/5; object-fit: cover; }
.pay-methods { display: grid; gap: 0.7rem; margin-top: 1.6rem; }
.pay-method {
  border: 1px solid var(--border); padding: 0.9em 1.1em;
  display: flex; align-items: center; gap: 0.8rem;
  font-size: 0.9rem;
}
.pay-method input { accent-color: var(--gold); }
.trust-note { font-size: 0.78rem; color: var(--muted); margin-top: 1rem; display: flex; gap: 0.5rem; align-items: flex-start; }

/* ---- Toast ---- */
.toast {
  position: fixed; bottom: 1.6rem; left: 50%;
  transform: translate(-50%, 1rem);
  background: var(--gold);
  color: #16140f;
  padding: 0.8em 1.4em;
  font-size: 0.88rem;
  z-index: 80;
  opacity: 0;
  transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---- Misc pages ---- */
.page-header {
  padding-block: clamp(3rem, 7vw, 5rem) 2rem;
  border-bottom: 1px solid var(--border-soft);
}
.page-header h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); }
.contact-layout { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(2rem, 5vw, 4rem); }
@media (max-width: 800px) { .contact-layout { grid-template-columns: 1fr; } }
.info-line { display: flex; gap: 0.9rem; padding-block: 1rem; border-bottom: 1px solid var(--border-soft); }
.info-line .k { color: var(--muted); font-size: 0.82rem; min-width: 6rem; }

.breadcrumb { font-size: 0.8rem; color: var(--muted); margin-bottom: 1.5rem; }
.breadcrumb a:hover { color: var(--gold-light); }

<script>
/* ==========================================================================
   NEXORA LUXE — single-file build (SPA)
   Hash-based routes: #home #shop #product?id=X #cart #checkout #confirmation
   #about #contact. Cart persists in localStorage. All view HTML is built
   here and injected into #view-root by the router.
   ========================================================================== */

/* ---------- money ---------- */
function formatPrice(amount) {
  return `${NEXORA_CONFIG.brand.currency}${Number(amount).toLocaleString("en-IN")}`;
}

/* ---------- cart storage ---------- */
const NEXORA_CART_KEY = "nexora_cart";

function getCart() {
  try {
    return JSON.parse(localStorage.getItem(NEXORA_CART_KEY)) || [];
  } catch (e) {
    return [];
  }
}
function saveCart(cart) {
  localStorage.setItem(NEXORA_CART_KEY, JSON.stringify(cart));
  updateCartCount();
}
function findProduct(id) {
  return NEXORA_CONFIG.products.find((p) => p.id === id);
}
function addToCart(productId, size, qty = 1) {
  const cart = getCart();
  const lineKey = `${productId}::${size || "one-size"}`;
  const existing = cart.find((l) => l.key === lineKey);
  if (existing) existing.qty += qty;
  else cart.push({ key: lineKey, productId, size: size || null, qty });
  saveCart(cart);
  showToast("Added to bag");
  renderCartDrawer();
}
function updateCartQty(lineKey, qty) {
  let cart = getCart();
  if (qty <= 0) cart = cart.filter((l) => l.key !== lineKey);
  else {
    const line = cart.find((l) => l.key === lineKey);
    if (line) line.qty = qty;
  }
  saveCart(cart);
  renderCartDrawer();
  if (currentRoute === "cart") renderView();
}
function removeFromCart(lineKey) {
  saveCart(getCart().filter((l) => l.key !== lineKey));
  renderCartDrawer();
  if (currentRoute === "cart") renderView();
}
function cartLines() {
  return getCart()
    .map((l) => {
      const product = findProduct(l.productId);
      return product ? { ...l, product } : null;
    })
    .filter(Boolean);
}
function cartSubtotal() {
  return cartLines().reduce((sum, l) => sum + l.product.price * l.qty, 0);
}
function cartCount() {
  return getCart().reduce((sum, l) => sum + l.qty, 0);
}
function updateCartCount() {
  document.querySelectorAll("[data-cart-count]").forEach((el) => (el.textContent = cartCount()));
}

/* ---------- toast ---------- */
let toastTimer;
function showToast(message) {
  let el = document.querySelector(".toast");
  if (!el) {
    el = document.createElement("div");
    el.className = "toast";
    document.body.appendChild(el);
  }
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

/* ---------- header / footer ---------- */
function renderHeader(activeRoute) {
  const mount = document.getElementById("site-header");
  const b = NEXORA_CONFIG.brand;
  const links = [
    { route: "home", label: "Home" },
    { route: "shop", label: "Shop" },
    { route: "about", label: "About" },
    { route: "contact", label: "Contact" }
  ];
  mount.innerHTML = `
    <div class="wrap">
      <a href="#home" class="brand"><span class="ring">N</span><span>${b.name}</span></a>
      <nav class="nav-links" id="nav-links">
        ${links.map((l) => `<a href="#${l.route}" class="${l.route === activeRoute ? "active" : ""}">${l.label}</a>`).join("")}
      </nav>
      <div class="nav-actions">
        <button class="icon-btn" id="nav-toggle" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <button class="icon-btn" id="cart-toggle" aria-label="Open cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          <span class="cart-count" data-cart-count>0</span>
        </button>
      </div>
    </div>`;
  document.getElementById("nav-toggle").addEventListener("click", () => document.getElementById("nav-links").classList.toggle("open"));
  document.getElementById("cart-toggle").addEventListener("click", openCartDrawer);
  updateCartCount();
}

function renderFooter() {
  const mount = document.getElementById("site-footer");
  const b = NEXORA_CONFIG.brand;
  mount.innerHTML = `
    <div class="wrap">
      <div class="footer-grid">
        <div><h4>${b.name}</h4><p style="max-width:26ch;color:var(--ivory-dim);font-size:0.9rem;">${b.tagline}</p></div>
        <div><h4>Shop</h4><ul>
          <li><a href="#shop?category=women">Women</a></li>
          <li><a href="#shop?category=men">Men</a></li>
          <li><a href="#shop?category=accessories">Accessories</a></li>
        </ul></div>
        <div><h4>Studio</h4><ul>
          <li><a href="#about">About</a></li>
          <li><a href="#contact">Contact</a></li>
          <li><a href="#cart">Bag</a></li>
        </ul></div>
        <div><h4>Reach us</h4><ul>
          <li><a href="mailto:${b.email}">${b.email}</a></li>
          <li><a href="tel:${b.phone.replace(/\s/g, "")}">${b.phone}</a></li>
          <li><a href="${b.instagram}" target="_blank" rel="noopener">Instagram</a></li>
        </ul></div>
      </div>
      <div class="footer-bottom">
        <span>© ${new Date().getFullYear()} ${b.fullName}. All rights reserved.</span>
        <span>${b.address}</span>
      </div>
    </div>`;
}

/* ---------- cart drawer ---------- */
function ensureDrawerMounted() {
  if (document.getElementById("cart-drawer")) return;
  const overlay = document.createElement("div");
  overlay.className = "cart-drawer-overlay";
  overlay.id = "cart-drawer-overlay";
  const drawer = document.createElement("div");
  drawer.className = "cart-drawer";
  drawer.id = "cart-drawer";
  document.body.append(overlay, drawer);
  overlay.addEventListener("click", closeCartDrawer);
}
function openCartDrawer() {
  ensureDrawerMounted();
  renderCartDrawer();
  document.getElementById("cart-drawer-overlay").classList.add("open");
  document.getElementById("cart-drawer").classList.add("open");
}
function closeCartDrawer() {
  const overlay = document.getElementById("cart-drawer-overlay");
  const drawer = document.getElementById("cart-drawer");
  if (overlay) overlay.classList.remove("open");
  if (drawer) drawer.classList.remove("open");
}
function renderCartDrawer() {
  ensureDrawerMounted();
  const drawer = document.getElementById("cart-drawer");
  const lines = cartLines();
  const subtotal = cartSubtotal();
  drawer.innerHTML = `
    <div class="cart-drawer-head">
      <span>Your Bag</span>
      <button class="icon-btn" id="close-drawer" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="cart-drawer-body">
      ${
        lines.length === 0
          ? `<div class="empty-state">Your bag is empty.<br><a href="#shop" class="btn btn-solid" style="margin-top:1.2rem;" onclick="closeCartDrawer()">Start shopping</a></div>`
          : lines
              .map(
                (l) => `
        <div class="cart-line">
          <img src="${l.product.images[0]}" alt="${l.product.name}">
          <div class="cart-line-info">
            <div class="cart-line-top"><span>${l.product.name}</span><span>${formatPrice(l.product.price * l.qty)}</span></div>
            <div class="cart-line-meta">${l.size ? "Size " + l.size : ""}</div>
            <div class="cart-line-controls">
              <div class="qty-row">
                <button onclick="updateCartQty('${l.key}', ${l.qty - 1})" aria-label="Decrease">−</button>
                <span>${l.qty}</span>
                <button onclick="updateCartQty('${l.key}', ${l.qty + 1})" aria-label="Increase">+</button>
              </div>
              <a class="remove-link" onclick="removeFromCart('${l.key}')">Remove</a>
            </div>
          </div>
        </div>`
              )
              .join("")
      }
    </div>
    ${
      lines.length > 0
        ? `<div class="cart-drawer-foot">
            <div class="subtotal-row"><span>Subtotal</span><span>${formatPrice(subtotal)}</span></div>
            <a href="#checkout" class="btn btn-solid btn-block" onclick="closeCartDrawer()">Checkout</a>
            <a href="#cart" class="btn btn-ghost btn-block" style="margin-top:0.6rem;justify-content:center;" onclick="closeCartDrawer()">View bag</a>
          </div>`
        : ""
    }`;
  document.getElementById("close-drawer").addEventListener("click", closeCartDrawer);
}

/* ==========================================================================
   VIEWS
   ========================================================================== */

function categoryLabel(id) {
  return NEXORA_CONFIG.categories.find((c) => c.id === id).label;
}

function productCardHTML(p) {
  return `
    <div class="product-card">
      <a href="#product?id=${p.id}" class="thumb">
        ${p.tag ? `<span class="tag">${p.tag}</span>` : ""}
        <img src="${p.images[0]}" alt="${p.name}">
      </a>
      <div class="quick-add"><a href="#product?id=${p.id}" class="btn btn-solid btn-block">View product</a></div>
      <a href="#product?id=${p.id}" class="title-link name">${p.name}</a>
      <div class="meta">
        <span>${categoryLabel(p.category)}</span>
        <span class="price">
          ${p.compareAt ? `<s style="color:var(--muted);margin-right:0.4em;">${formatPrice(p.compareAt)}</s>` : ""}
          ${formatPrice(p.price)}
        </span>
      </div>
    </div>`;
}

/* ---- Shop ---- */

let shopSort = "featured";

function viewShop(params) {
  document.title = "Shop — Nexora Luxe";
  if (params.get("category")) shopCategory = params.get("category");
  return `
    <div class="page-header"><div class="wrap"><span class="eyebrow">Shop</span><h1 style="margin-top:0.6rem;">The full collection</h1></div></div>
    <section class="section wrap">
      <div class="filters-bar" id="filters-bar"></div>

        <span id="result-count"></span>
        <select class="select-minimal" id="sort-select">
          <option value="featured">Sort: Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name-asc">Name: A–Z</option>
        </select>
      </div>
      <div class="product-grid" id="product-grid"></div>
    </section>`;
}

function bindShopView() {
  const cats = [{ id: "all", label: "All" }, ...NEXORA_CONFIG.categories];
  function renderFilters() {
    document.getElementById("filters-bar").innerHTML = cats
      .map((c) => `<button class="chip ${c.id === shopCategory ? "active" : ""}" data-cat="${c.id}">${c.label}</button>`)
      .join("");
    document.querySelectorAll("[data-cat]").forEach((btn) =>
      btn.addEventListener("click", () => {
        shopCategory = btn.dataset.cat;
        renderFilters();
        renderGrid();
      })
    );
  }
  function renderGrid() {
    let list = NEXORA_CONFIG.products.filter((p) => shopCategory === "all" || p.category === shopCategory);
    if (shopSort === "price-asc") list = [...list].sort((a, b) => a.price - b.price);
    if (shopSort === "price-desc") list = [...list].sort((a, b) => b.price - a.price);
    if (shopSort === "name-asc") list = [...list].sort((a, b) => a.name.localeCompare(b.name));
    document.getElementById("result-count").textContent = `${list.length} piece${list.length !== 1 ? "s" : ""}`;
    document.getElementById("product-grid").innerHTML = list.map(productCardHTML).join("");
  }
  document.getElementById("sort-select").value = shopSort;
  document.getElementById("sort-select").addEventListener("change", (e) => {
    shopSort = e.target.value;
    renderGrid();
  });
  renderFilters();
  renderGrid();
}

let pdpSelectedSize = null;
let pdpQty = 1;

function viewProduct(params) {

function renderPDP(product) {
  document.getElementById("pdp-mount").innerHTML = `

        </div>
      </div>
      <div class="pdp-info">

        <h1>${product.name}</h1>
        <div class="pdp-price">
          ${product.compareAt ? `<s style="color:var(--muted);margin-right:0.5em;font-size:0.8em;">${formatPrice(product.compareAt)}</s>` : ""}

            ? `<div class="option-group">

                <div class="size-row" id="size-row">

                </div>
              </div>`
            : ""
        }
        <div class="option-group">
          <div class="option-label"><span>Quantity</span></div>
          <div class="qty-row">
            <button id="qty-minus">−</button><span id="qty-display">${pdpQty}</span><button id="qty-plus">+</button>
          </div>
        </div>
        <div class="pdp-actions">
          <button class="btn btn-solid" id="add-to-cart-btn" style="flex:1;min-width:12rem;">Add to bag</button>
          <a href="#cart" class="btn" style="flex:1;min-width:10rem;text-align:center;">View bag</a>
        </div>

          <details class="accordion-item" open><summary>Details &amp; care</summary><p>${product.details.join(" · ")}</p></details>
          <details class="accordion-item"><summary>Shipping &amp; returns</summary><p>Free shipping on orders over ${formatPrice(NEXORA_CONFIG.brand.freeShippingThreshold)}. Standard shipping is ${formatPrice(NEXORA_CONFIG.brand.shippingFlat)} and arrives in 3–6 business days. Returns accepted within 14 days, unworn and tagged.</p></details>
        </div>
        <div class="badge-row">
          <span class="item">Secure checkout</span><span class="item">14-day returns</span><span class="item">Made in India</span>
        </div>
      </div>
    </div>`;

  document.querySelectorAll("[data-img]").forEach((btn) =>
    btn.addEventListener("click", () => {
      pdpActiveImage = Number(btn.dataset.img);
      renderPDP(product);
    })
  );
  if (product.sizes) {
    document.querySelectorAll("[data-size]").forEach((btn) =>
      btn.addEventListener("click", () => {
        pdpSelectedSize = btn.dataset.size;
        renderPDP(product);
      })
    );
  }
  document.getElementById("qty-minus").addEventListener("click", () => {
    pdpQty = Math.max(1, pdpQty - 1);
    renderPDP(product);
  });
  document.getElementById("qty-plus").addEventListener("click", () => {
    pdpQty += 1;
    renderPDP(product);
  });
  document.getElementById("add-to-cart-btn").addEventListener("click", () => {
    if (product.sizes && !pdpSelectedSize) {
      showToast("Please select a size");
      return;
    }
    addToCart(product.id, pdpSelectedSize, pdpQty);
  });
}

/* ---------- Razorpay integration ----------
   IMPORTANT: Razorpay (and Stripe) require the order to be created server-side
   with your secret key — it can never live in frontend JS. See the notes at
   the bottom of this file for the exact backend endpoints this expects.
   Until NEXORA_CONFIG.payment.razorpayKeyId is a real key, checkout runs in
   demo mode so the full flow can be tested end to end. */
let lastOrder = null;

async function handlePlaceOrder(totalAmount) {
  const btn = document.getElementById("place-order-btn");
  btn.disabled = true;
  btn.textContent = "Processing…";

  const customer = {
    email: document.getElementById("email").value,
    name: `${document.getElementById("first-name").value} ${document.getElementById("last-name").value}`,
    phone: document.getElementById("phone").value,
    address: document.getElementById("address").value,
    city: document.getElementById("city").value,
    state: document.getElementById("state").value,
    pincode: document.getElementById("pincode").value
  };

  const isLiveKey = NEXORA_CONFIG.payment.razorpayKeyId && !NEXORA_CONFIG.payment.razorpayKeyId.includes("XXXX");

  if (!isLiveKey) {
    setTimeout(() => {
      completeOrder({ demo: true, customer, amount: totalAmount });
    }, 900);
    return;
  }

  try {
    const orderRes = await fetch(NEXORA_CONFIG.payment.createOrderEndpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ amount: totalAmount, currency: NEXORA_CONFIG.brand.currencyCode, customer })
    });
    const order = await orderRes.json();

    const rzp = new Razorpay({
      key: NEXORA_CONFIG.payment.razorpayKeyId,
      amount: order.amount,
      currency: order.currency,
      name: NEXORA_CONFIG.brand.fullName,
      description: "Order payment",
      order_id: order.id,
      prefill: { name: customer.name, email: customer.email, contact: customer.phone },
      theme: { color: "#c6a24d" },
      handler: async function (response) {
        const verifyRes = await fetch(NEXORA_CONFIG.payment.verifyPaymentEndpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...response, customer })
        });
        const verified = await verifyRes.json();
        if (verified.ok) completeOrder({ demo: false, customer, amount: totalAmount });
        else {
          showToast("Payment could not be verified. Please contact support.");
          resetPlaceOrderButton();
        }
      },
      modal: { ondismiss: resetPlaceOrderButton }
    });
    rzp.open();
  } catch (err) {
    showToast("Could not start checkout. Please try again.");
    resetPlaceOrderButton();
  }
}

function resetPlaceOrderButton() {
  const btn = document.getElementById("place-order-btn");
  if (btn) {
    btn.disabled = false;
    btn.textContent = "Try again";
  }
}

function completeOrder(orderDetails) {
  lastOrder = {
    orderId: "NX" + Math.floor(100000 + Math.random() * 900000),
    ...orderDetails,
    lines: cartLines().map((l) => ({ name: l.product.name, size: l.size, qty: l.qty, price: l.product.price }))
  };
  saveCart([]);
  window.location.hash = "#confirmation";
}

/* ==========================================================================
   ROUTER
   ========================================================================== */
let currentRoute = "home";

function parseHash() {
  const raw = window.location.hash.slice(1) || "home";
  const [route, query] = raw.split("?");
  return { route: route || "home", params: new URLSearchParams(query || "") };
}

function renderView() {
  const { route, params } = parseHash();
  currentRoute = route;
  const root = document.getElementById("view-root");

  switch (route) {
    case "shop":
      root.innerHTML = viewShop(params);
      bindShopView();
      break;
    case "product":
      root.innerHTML = viewProduct(params);
      bindProductView(params);
      break;
    case "cart":
      root.innerHTML = viewCart();
      bindCartView();
      break;
    case "checkout":
      root.innerHTML = viewCheckout();
      bindCheckoutView();
      break;
    case "confirmation":
      root.innerHTML = viewConfirmation();
      bindConfirmationView();
      break;
    case "about":
      root.innerHTML = viewAbout();
      break;
    case "contact":
      root.innerHTML = viewContact();
      bindContactView();
      break;
    case "home":
    default:
      root.innerHTML = viewHome();
      break;
  }

  renderHeader(route);
  document.getElementById("nav-links").classList.remove("open");
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", renderView);
window.addEventListener("DOMContentLoaded", () => {
  renderFooter();
  renderView();
});
